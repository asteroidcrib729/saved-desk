[package]
license = "MIT"
name = "saveddesk"
version = "0.2.10"
description = "A lightweight local media library"
edition = "2021"
default-run = "saveddesk"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "saveddesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2.3.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
sha2 = "0.10.9"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Networking_WinHttp"] }

[[bin]]
name = "saveddesk"
path = "src/main.rs"

[[bin]]
name = "saveddesk-native-host"
path = "src/bin/native_host.rs"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
