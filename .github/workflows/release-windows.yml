name: Windows release preview
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing tag (v0.2.11); leave blank to build the selected branch
        required: false
        default: ''
        type: string
      signing_mode:
        description: Unsigned review or real Azure Artifact Signing (requires setup)
        type: choice
        options: [unsigned, azure]
        default: unsigned
      create_draft:
        description: Create a private draft prerelease after building (does not publish)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    environment: ${{ inputs.signing_mode == 'azure' && 'release-signing' || 'release-preview' }}
    permissions:
      contents: read
      id-token: write # Manual release build only; Azure OIDC avoids long-lived secrets.
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      artifact_name: windows-exe-${{ steps.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.7'
          architecture: x64
      - name: Resolve branch preview or existing version tag
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          python packaging/resolve-release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (python packaging/audit-repository.py --version).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python packaging/release-quarantine.py --check-version $version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r packaging/requirements-lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip install --no-build-isolation -e "backend[development]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd --prefix desktop ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Audit source and ignore rules
        run: ./.venv/Scripts/python.exe packaging/audit-repository.py
      - name: Build standalone video tools from verified source
        run: ./.venv/Scripts/python.exe packaging/build-media-tools.py
      - name: Build and audit worker package
        shell: pwsh
        run: ./packaging/build-worker.ps1
      - name: Python worker checks
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'backend/src'
          ./.venv/Scripts/python.exe -m unittest discover -s backend/tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m unittest discover -s packaging/tests -v
      - name: Browser connector checks
        run: npm.cmd --prefix desktop run test:connector
      - name: Static frontend
        run: npm.cmd --prefix desktop run build
      - name: TypeScript checks
        run: npm.cmd --prefix desktop run typecheck
      - name: Install Edge for UI checks
        working-directory: desktop
        run: npx.cmd playwright install msedge
      - name: UI checks
        run: npm.cmd --prefix desktop test
      - name: Install the tested Rust toolchain
        run: rustup default 1.99.0
      - name: Native unit checks
        run: ./packaging/build-desktop.ps1 -Check
      - name: Authenticate to signing service using OIDC
        if: ${{ inputs.signing_mode == 'azure' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure pinned signing client
        if: ${{ inputs.signing_mode == 'azure' }}
        shell: pwsh
        env:
          SAVEDDESK_SIGN_AZURE_ENDPOINT: ${{ vars.SAVEDDESK_SIGN_AZURE_ENDPOINT }}
          SAVEDDESK_SIGN_AZURE_ACCOUNT: ${{ vars.SAVEDDESK_SIGN_AZURE_ACCOUNT }}
          SAVEDDESK_SIGN_AZURE_PROFILE: ${{ vars.SAVEDDESK_SIGN_AZURE_PROFILE }}
        run: |
          ./packaging/setup-signing.ps1
          "SAVEDDESK_SIGN_PROVIDER=azure" >> $env:GITHUB_ENV
          "SAVEDDESK_SIGN_DLIB_PATH=$env:SAVEDDESK_SIGN_DLIB_PATH" >> $env:GITHUB_ENV
          foreach ($name in @('SAVEDDESK_SIGN_AZURE_ENDPOINT','SAVEDDESK_SIGN_AZURE_ACCOUNT','SAVEDDESK_SIGN_AZURE_PROFILE')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
      - name: Build fresh Windows release review assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          $signed = '${{ inputs.signing_mode }}' -eq 'azure'
          $arguments = @{ Tag = $env:RELEASE_TAG; RequireSigning = $signed }
          # Existing tags can contain the older script interface. Reuse only
          # when that selected source implements the audited reuse switch.
          $script = Get-Command ./packaging/build-release.ps1
          if ($script.Parameters.ContainsKey('ReuseWorker')) { $arguments.ReuseWorker = $true }
          & ./packaging/build-release.ps1 @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Write EXE build summary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          TAG_MATCHES_SOURCE: ${{ steps.metadata.outputs.tag_matches_source }}
        run: |
          $manifest = Get-Content (Join-Path "release-artifacts/$env:RELEASE_TAG" 'release-manifest.json') -Raw | ConvertFrom-Json
          @(
            '## SavedDesk Windows x64 EXE preview',
            "Source commit: $($manifest.source_commit)",
            "Version label: $($manifest.tag)",
            "Existing tag matches source: $env:TAG_MATCHES_SOURCE",
            "Installer signature: $($manifest.signature_status)",
            '',
            'Download the windows-exe artifact below. It includes the EXE, connector, notices, corresponding sources and SHA256SUMS.txt.',
            'A branch build does not create or publish a Git tag or GitHub release. A draft is created only when explicitly selected and a matching tag exists.',
            'This build does not establish installation lifecycle acceptance, trusted signing or Microsoft certification.'
          ) >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-exe-${{ steps.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/${{ steps.metadata.outputs.release_tag }}/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  draft:
    if: ${{ inputs.create_draft }}
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: review-assets
      - name: Create a draft prerelease without replacing assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid tag.' }
          if ([version]$env:RELEASE_TAG.Substring(1) -le [version]'0.2.3') { throw 'Uncleared historical previews are quarantined; draft creation is blocked.' }
          $notes = @(Get-ChildItem review-assets -Recurse -Filter release-notes.txt)
          if ($notes.Count -ne 1) { throw 'Expected one release asset set.' }
          $manifest = Get-Content -LiteralPath (Join-Path $notes[0].DirectoryName 'release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.tag -ne $env:RELEASE_TAG -or ('v'+$manifest.version) -ne $env:RELEASE_TAG) { throw 'Artifact manifest/tag mismatch.' }
          if ($manifest.source_commit -ne $env:EXPECTED_SOURCE_COMMIT) { throw 'Draft artifact source differs from the build job.' }
          $remoteCommit = gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -or $remoteCommit -ne $manifest.source_commit) { throw 'Release tag moved or differs from the built source.' }
          $assets = @(Get-ChildItem -LiteralPath $notes[0].DirectoryName -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --draft --prerelease --verify-tag --title "SavedDesk $env:RELEASE_TAG preview" --notes-file $notes[0].FullName
          if ($LASTEXITCODE) { throw 'Draft creation failed; existing releases are not overwritten.' }
